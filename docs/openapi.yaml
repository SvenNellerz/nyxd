openapi: 3.0.3
info:
  title: nyxd control API
  description: |
    Minimal HTTP API for **nyxd**, served on a **Unix domain socket** (default `/run/nyxd/nyxd.sock`).
    There is no TCP listener by default.

    **Calling the API**

    ```bash
    curl -sS --unix-socket /run/nyxd/nyxd.sock http://localhost/v1/ping
    ```

    Replace `/run/nyxd/nyxd.sock` with your socket path or `NYXD_SOCKET` / `nyx -socket`.

    **Authentication:** none today (local trust). Socket permissions are typically `0660`.

    **Errors:** many routes use `text/plain` bodies from `http.Error`; JSON endpoints return `application/json` on success.
  version: "1.0.0"
  license:
    name: PolyForm Noncommercial License 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/

servers:
  - url: http://localhost
    description: |
      Use `curl --unix-socket <path> http://localhost/...` (host name is ignored; only the socket path matters).

tags:
  - name: system
    description: Health and version
  - name: images
    description: Image pull, list, and remove
  - name: containers
    description: Container lifecycle and exec

paths:
  /v1/ping:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"

  /v1/version:
    get:
      tags: [system]
      summary: Daemon version metadata
      operationId: getVersion
      responses:
        "200":
          description: Version payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /v1/containers:
    get:
      tags: [containers]
      summary: List supervised containers
      description: |
        Without `detail`, returns `{"containers":["id",...]}` (IDs only).

        With `?detail=1` or `?detail=true`, also returns `items`: an array of
        `{id, image, ip, status}` suitable for `nyx ps`.
      operationId: listContainers
      parameters:
        - name: detail
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", ""]
          description: When `1` or `true`, include per-container metadata in `items`.
      responses:
        "200":
          description: Container list (with or without detail)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ContainersResponse"
                  - $ref: "#/components/schemas/ContainersDetailResponse"

  /v1/images/pull:
    post:
      tags: [images]
      summary: Pull an image from a registry
      description: |
        When `stream` is **false** or omitted, returns a single JSON object on success.

        When `stream` is **true**, the response is **`application/x-ndjson`**: one JSON object per line
        (`PullEvent`), flushed progressively, ending with a `phase: done` line (or `phase: error`).
      operationId: pullImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequest"
      responses:
        "200":
          description: Success — either one JSON document or NDJSON stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponseJSON"
            application/x-ndjson:
              schema:
                type: string
                format: binary
                description: |
                  Each line is a `PullEvent` JSON object. Final line uses `phase: done` with summary fields.
        "400":
          description: Bad request (invalid body / missing ref)
        "502":
          description: Registry or transport error (non-stream mode)
        "503":
          description: Image store not configured

  /v1/containers/run:
    post:
      tags: [containers]
      summary: Create and start a container
      description: |
        Starts a detached OCI workload via crun. Requires the image to have been pulled first.
        If `id` is omitted, the server generates one from the image reference.
      operationId: runContainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          description: Validation or start error (plain text)
        "503":
          description: Supervisor or image store unavailable

  /v1/containers/{id}/stop:
    post:
      tags: [containers]
      summary: Stop a container
      description: Sends the image stop signal (default SIGTERM) then SIGKILL if needed.
      operationId: stopContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stop accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResponse"
        "400":
          description: Bad request
        "404":
          description: Container not found
        "503":
          description: Supervisor unavailable

  /v1/containers/{id}/remove:
    post:
      tags: [containers]
      summary: Remove a container
      description: |
        Stops the container if needed, deletes crun state, and tears down
        network and overlay resources.
      operationId: removeContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveResponse"
        "400":
          description: Bad request
        "404":
          description: Container not found
        "503":
          description: Supervisor unavailable

  /v1/containers/{id}/exec:
    post:
      tags: [containers]
      summary: Run a command inside a running container
      description: |
        Streams combined stdout/stderr as raw bytes (`application/octet-stream`).
        The HTTP connection stays open until the exec completes.
      operationId: execInContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Raw command output (stream)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request
        "503":
          description: Runtime unavailable

  /v1/containers/{id}/kill:
    post:
      tags: [containers]
      summary: Send a signal to a container (default SIGKILL)
      description: |
        Optional JSON body `{"signal":"KILL"}` (or `SIGKILL`). Used by foreground `nyx run` on Ctrl+C.
      operationId: killContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signal:
                  type: string
                  description: Signal name without or with `SIG` prefix (e.g. `KILL`, `SIGTERM`).
      responses:
        "200":
          description: Kill accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillResponse"
        "400":
          description: Bad request
        "404":
          description: Container not found
        "503":
          description: Supervisor unavailable

  /v1/containers/{id}/logs:
    get:
      tags: [containers]
      summary: Container stdout/stderr log file
      description: |
        Reads `logs/{id}.log` under the daemon data directory. With `plain=1` (default), JSONL
        lines are decoded to plain text. With `follow=1`, new lines are streamed until the client disconnects.
      operationId: containerLogs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 99999
          description: Number of trailing lines to send first (default 200).
        - name: follow
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", ""]
        - name: plain
          in: query
          required: false
          schema:
            type: string
          description: When not `0`, decode JSONL log entries to text (default on).
      responses:
        "200":
          description: Plain text log stream (or snapshot when not following)
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No log file for this container
        "500":
          description: Read error

  /v1/images:
    get:
      tags: [images]
      summary: List locally stored image references
      operationId: listImages
      responses:
        "200":
          description: Image ref list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagesListResponse"
        "503":
          description: Image store not configured

  /v1/images/remove:
    post:
      tags: [images]
      summary: Remove local image metadata for a ref
      operationId: removeImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRemoveRequest"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRemoveResponse"
        "400":
          description: Bad request
        "503":
          description: Image store not configured

  /v1/images/prune:
    post:
      tags: [images]
      summary: Remove local image metadata not referenced by any supervised container
      description: |
        Uses in-memory supervisor container specs (`ContainerSpec.Image` strings) as the keep set.
        Does not delete content blobs under `blobs/sha256`.
      operationId: pruneImages
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePruneRequest"
      responses:
        "200":
          description: Prune result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePruneResponse"
        "400":
          description: Bad request
        "503":
          description: Image store or supervisor not configured

components:
  schemas:
    PingResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    VersionResponse:
      type: object
      required: [daemon, version, commit, buildDate]
      properties:
        daemon:
          type: string
          example: nyxd
        version:
          type: string
        commit:
          type: string
        buildDate:
          type: string

    ContainersResponse:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items:
            type: string

    ContainersDetailResponse:
      type: object
      required: [containers, items]
      properties:
        containers:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContainerItem"

    ContainerItem:
      type: object
      required: [id, image, status]
      properties:
        id:
          type: string
        image:
          type: string
        ip:
          type: string
        status:
          type: string
          description: crun state status (e.g. running, stopped)

    RemoveResponse:
      type: object
      required: [ok, id]
      properties:
        ok:
          type: boolean
        id:
          type: string

    KillResponse:
      type: object
      required: [ok, id, signal]
      properties:
        ok:
          type: boolean
        id:
          type: string
        signal:
          type: string
          example: KILL

    ImagesListResponse:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            type: string

    ImageRemoveRequest:
      type: object
      required: [ref]
      properties:
        ref:
          type: string

    ImageRemoveResponse:
      type: object
      required: [ok, ref]
      properties:
        ok:
          type: boolean
        ref:
          type: string

    ImagePruneRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          description: If true, only list refs that would be removed.

    ImagePruneResponse:
      type: object
      required: [ok, dry_run, removed, in_use]
      properties:
        ok:
          type: boolean
        dry_run:
          type: boolean
        removed:
          type: array
          items:
            type: string
        in_use:
          type: integer
          description: Count of distinct image refs held by supervised containers.

    PullRequest:
      type: object
      required: [ref]
      properties:
        ref:
          type: string
          description: Image reference (e.g. `nginx:alpine` or `registry/repo@sha256:...`)
          example: nginx:alpine
        stream:
          type: boolean
          description: If true, response is NDJSON stream instead of a single JSON object

    PullResponseJSON:
      type: object
      required: [ok, ref, config]
      properties:
        ok:
          type: boolean
        ref:
          type: string
        config:
          type: object
          description: Subset of OCI image config
          properties:
            os:
              type: string
            architecture:
              type: string
            entrypoint:
              type: array
              items:
                type: string
            cmd:
              type: array
              items:
                type: string
            working_dir:
              type: string
            env_len:
              type: integer

    PullEvent:
      type: object
      description: One NDJSON line when `stream` is true
      required: [phase]
      properties:
        phase:
          type: string
          enum:
            - begin
            - auth
            - manifest
            - config
            - layer
            - progress
            - layer_done
            - meta
            - done
            - error
        ref:
          type: string
        message:
          type: string
        media_type:
          type: string
        layer_count:
          type: integer
        index:
          type: integer
        count:
          type: integer
        digest:
          type: string
        size:
          type: integer
          format: int64
        cached:
          type: boolean
        current:
          type: integer
          format: int64
        ok:
          type: boolean
        ref_out:
          type: string
        config:
          $ref: "#/components/schemas/PullSummary"
        error:
          type: string

    PullSummary:
      type: object
      properties:
        os:
          type: string
        architecture:
          type: string
        entrypoint:
          type: array
          items:
            type: string
        cmd:
          type: array
          items:
            type: string
        working_dir:
          type: string
        env_len:
          type: integer
        rootfs_diff_ids:
          type: integer

    RunRequest:
      type: object
      required: [image]
      properties:
        id:
          type: string
          description: Optional container id; generated if empty
        image:
          type: string
          description: Image ref as stored after pull (e.g. `nginx:alpine`)
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            type: string
        hostname:
          type: string
        restart:
          type: string
          description: Restart policy (`always`, `on-failure`, `unless-stopped`, `never`, …)
        publish:
          type: array
          description: Docker-style port specs (e.g. `8080:80`, `127.0.0.1:9000:443/udp`)
          items:
            type: string
        ports:
          type: array
          description: Structured port maps (alternative to `publish`)
          items:
            type: object
            required: [hostPort, containerPort]
            properties:
              hostPort:
                type: integer
              containerPort:
                type: integer
              protocol:
                type: string
                enum: [tcp, udp]

    RunResponse:
      type: object
      required: [ok, id, image]
      properties:
        ok:
          type: boolean
        id:
          type: string
        image:
          type: string

    StopResponse:
      type: object
      required: [ok, id]
      properties:
        ok:
          type: boolean
        id:
          type: string

    ExecRequest:
      type: object
      required: [argv]
      properties:
        argv:
          type: array
          items:
            type: string
          description: argv[0] is the program to exec
